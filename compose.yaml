services:
  projects-workflow:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_PATH: /app/data/projects.sqlite
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - projects_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 4
volumes:
  projects_data:
