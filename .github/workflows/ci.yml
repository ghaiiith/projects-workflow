name: Validate application
on:
  push:
    branches: [main, feature/government-project-platform]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check server/workflow.mjs
      - run: node --check server/db.mjs
      - run: node --check server/index.mjs
      - run: npm test
      - run: npm run build
